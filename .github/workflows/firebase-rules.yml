on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'database.rules.json'   # <--- Tracks changes to database.rules.json
  workflow_dispatch:

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy Firestore & RTDB Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,database
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
