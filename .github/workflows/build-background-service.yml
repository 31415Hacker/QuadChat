name: Build QuadChat Background Service

on:
  push:
    branches: [main]
    paths:
      - "quadchat-background-service/**"
      - ".github/workflows/build-background-service.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: quadchat-background-service.exe
            package: exe
          - os: macos-latest
            name: macos-arm64
            binary: quadchat-background-service
            package: pkg
          - os: ubuntu-latest
            name: linux-x64
            binary: quadchat-background-service
            package: deb
    defaults:
      run:
        working-directory: quadchat-background-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build Windows installer
        if: matrix.package == 'exe'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/quadchat-background-service.exe installers/quadchat-background-service.exe
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installers/windows-installer.nsi
      - name: Build macOS package
        if: matrix.package == 'pkg'
        shell: bash
        run: |
          mkdir -p package-root/usr/local/bin
          cp target/release/${{ matrix.binary }} package-root/usr/local/bin/quadchat-background-service
          pkgbuild --root package-root --identifier com.quadchat.background-service --version 0.1.0 --install-location / quadchat-background-service-macos-arm64.pkg
      - name: Build Linux package
        if: matrix.package == 'deb'
        shell: bash
        run: |
          mkdir -p package-root/usr/local/bin package-root/DEBIAN
          cp target/release/${{ matrix.binary }} package-root/usr/local/bin/quadchat-background-service
          cp installers/DEBIAN/control package-root/DEBIAN/control
          dpkg-deb --build package-root quadchat-background-service-linux-x64.deb
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.package }}" = "pkg" ]; then cp quadchat-background-service-macos-arm64.pkg dist/; fi
          if [ "${{ matrix.package }}" = "deb" ]; then cp quadchat-background-service-linux-x64.deb dist/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: quadchat-background-service/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: background-service-latest
          name: QuadChat Background Service (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-assets/*
