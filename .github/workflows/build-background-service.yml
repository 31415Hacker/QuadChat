name: Build QuadChat Background Service

on:
  push:
    branches: [main]
    paths:
      - "quadchat-background-service/**"
      - ".github/workflows/build-background-service.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: quadchat-background-service.exe
            package: exe
          - os: macos-latest
            name: macos-arm64
            binary: quadchat-background-service
            package: pkg
          - os: ubuntu-latest
            name: linux-x64
            binary: quadchat-background-service
            package: deb
    defaults:
      run:
        working-directory: quadchat-background-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio build dependencies
        if: matrix.package == 'deb'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo build --release
      - name: Build Windows installer
        if: matrix.package == 'exe'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path installers/dist
          Copy-Item target/release/quadchat-background-service.exe installers/quadchat-background-service.exe
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installers/windows-installer.nsi
      - name: Build macOS package
        if: matrix.package == 'pkg'
        shell: bash
        run: |
          mkdir -p package-root/usr/local/bin
          cp target/release/${{ matrix.binary }} package-root/usr/local/bin/quadchat-background-service
          mkdir -p "package-root/Applications/QuadChat Companion.app/Contents/MacOS"
          cp target/release/${{ matrix.binary }} "package-root/Applications/QuadChat Companion.app/Contents/MacOS/QuadChat Companion"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>QuadChat Companion</string><key>CFBundleIdentifier</key><string>com.quadchat.background-service</string><key>CFBundleName</key><string>QuadChat Companion</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > "package-root/Applications/QuadChat Companion.app/Contents/Info.plist"
          pkgbuild --root package-root --identifier com.quadchat.background-service --version 1.5.1 --install-location / quadchat-background-service-macos-arm64.pkg
      - name: Build Linux package
        if: matrix.package == 'deb'
        shell: bash
        run: |
          mkdir -p package-root/usr/local/bin package-root/DEBIAN
          cp target/release/${{ matrix.binary }} package-root/usr/local/bin/quadchat-background-service
          cp installers/DEBIAN/control package-root/DEBIAN/control
          mkdir -p package-root/usr/share/applications
          cp installers/quadchat-companion.desktop package-root/usr/share/applications/quadchat-companion.desktop
          dpkg-deb --build package-root quadchat-background-service-linux-x64.deb
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.package }}" = "exe" ]; then cp installers/dist/quadchat-background-service-windows-x64-setup.exe dist/; fi
          if [ "${{ matrix.package }}" = "pkg" ]; then cp quadchat-background-service-macos-arm64.pkg dist/; fi
          if [ "${{ matrix.package }}" = "deb" ]; then cp quadchat-background-service-linux-x64.deb dist/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: quadchat-background-service/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: background-service-latest
          name: QuadChat Background Service (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-assets/*
