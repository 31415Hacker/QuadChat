<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorize QuadChat Service</title><style>body{font:16px system-ui;background:#0b1513;color:#edf8f2;max-width:520px;margin:80px auto;padding:24px}main{background:#12221d;border:1px solid #29453a;border-radius:14px;padding:28px}button{padding:11px 16px;border:0;border-radius:8px;background:#287b65;color:#fff;font-weight:700;cursor:pointer}</style><main><h1>Authorize QuadChat Service</h1><p>This local development service will receive only test events while it is running. It cannot access your QuadChat account, messages, or calls.</p><button id="authorize">Authorize local service</button></main><script>document.querySelector('#authorize').onclick=()=>{const state=new URLSearchParams(location.search).get('state');const code=crypto.randomUUID();location.href=`http://127.0.0.1:43721/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state||'')}`}</script></html>
