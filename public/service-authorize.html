<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorize QuadChat Local Service</title><style>body{font:16px system-ui;background:#0b1513;color:#edf8f2;max-width:520px;margin:80px auto;padding:24px}main{background:#12221d;border:1px solid #29453a;border-radius:14px;padding:28px}button{padding:11px 16px;border:0;border-radius:8px;background:#287b65;color:#fff;font-weight:700;cursor:pointer}p{line-height:1.5}</style><main><h1>Authorize local service</h1><p>Approve the development-only QuadChat companion. The local OAuth issuer will return a one-time code; the service exchanges it using PKCE. No account, Firebase project, or production service is contacted.</p><button id="authorize">Authorize local service</button><p id="error"></p></main><script>document.querySelector('#authorize').onclick=async()=>{const transaction=new URLSearchParams(location.search).get('transaction');if(!transaction){error.textContent='Missing local authorization transaction.';return}try{const r=await fetch('http://127.0.0.1:43722/authorize/approve',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'transaction='+encodeURIComponent(transaction)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Authorization failed');location.assign(d.redirectUrl)}catch(e){error.textContent='Authorization failed: '+e.message}}</script></html>
