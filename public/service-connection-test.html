<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuadChat Service Connection Test</title><style>body{font:16px system-ui;background:#10201d;color:#eef8f3;max-width:620px;margin:48px auto;padding:0 20px}input,button{font:inherit;padding:10px;border-radius:7px;margin:5px 0}input{width:100%;box-sizing:border-box}button{background:#2d9a80;color:white;border:0;cursor:pointer}pre{background:#08110f;padding:14px;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>QuadChat Service Connection Test</h1><p>Local-only test harness. Start the Rust service first, then pair and send an event.</p><input id="token" value="quadchat-local-test" aria-label="Test token"><button onclick="send('/pair')">Pair local service</button> <button onclick="send('/event')">Send test event</button><pre id="result">Waiting…</pre><script>async function send(path){const out=document.querySelector('#result');try{const r=await fetch('http://127.0.0.1:43721'+path,{method:'POST',headers:{'X-QuadChat-Test-Token':document.querySelector('#token').value,'Content-Type':'application/json'},body:'{}'});out.textContent=`${r.status} ${await r.text()}`}catch(e){out.textContent=`Connection failed: ${e.message}`}}</script></body></html>
