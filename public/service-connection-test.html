<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuadChat Service Lab</title><style>body{font:15px system-ui;background:#0b1513;color:#eaf7f1;max-width:760px;margin:40px auto;padding:0 20px}header{display:flex;gap:12px;align-items:center;border-bottom:1px solid #29453a;padding-bottom:18px}h1{margin:0;font-size:24px}.badge{padding:4px 8px;border-radius:99px;background:#243731;color:#aee8c9;font-size:12px}main{display:grid;grid-template-columns:180px 1fr;gap:24px;margin-top:24px}nav{display:grid;gap:7px}nav button{background:#14241f;color:#a9d1bd;text-align:left}section{background:#12221d;border:1px solid #29453a;border-radius:12px;padding:18px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #3a5a4c;box-sizing:border-box}input,select{width:100%;background:#09110f;color:#edf8f2}button{background:#287b65;color:white;cursor:pointer}button.secondary{background:#1b322a}label{display:grid;gap:6px;margin:12px 0}pre{background:#07100d;border-radius:8px;padding:12px;white-space:pre-wrap;color:#b9e8ce}.hidden{display:none}.ok{color:#79e2a5}.bad{color:#ff9f9f}</style></head><body><header><div><h1>QuadChat Service Lab</h1><small>Local connection test only</small></div><span class="badge" id="status">Not connected</span></header><main><nav><button onclick="show('connect')">Connection</button><button onclick="show('events')">Test events</button><button onclick="status()">Service status</button></nav><div><section id="connect"><h2>Pair local browser</h2><p>Paste the one-time token printed by the Rust service. It exists only while the local service is running.</p><label>Service token<input id="token" type="password" autocomplete="off" placeholder="Paste token from terminal"></label><button onclick="pair()">Pair this browser</button></section><section id="events" class="hidden"><h2>Send a local test event</h2><label>Event type<select id="event"><option>Message received</option><option>Incoming call</option><option>Call cancelled</option></select></label><button onclick="eventTest()">Send test event</button></section><pre id="result">Start the Rust service, then pair this browser.</pre></div></main><script>const base='http://127.0.0.1:43721';let paired=false;function show(id){for(const e of document.querySelectorAll('section'))e.classList.toggle('hidden',e.id!==id)}async function call(path,method='GET',body){const h={};if(method==='POST'){h['Content-Type']='application/json';h['X-QuadChat-Test-Token']=document.querySelector('#token').value}const r=await fetch(base+path,{method,headers:h,body:body?JSON.stringify(body):undefined});const t=await r.text();document.querySelector('#result').textContent=`${r.status} ${t}`;return[r,t]}async function pair(){try{const[r]=await call('/pair','POST',{});paired=r.ok;document.querySelector('#status').textContent=paired?'Paired locally':'Pairing failed';document.querySelector('#status').className=paired?'badge ok':'badge bad';if(paired)show('events')}catch(e){document.querySelector('#result').textContent='Connection failed: '+e.message}}async function eventTest(){if(!paired)return;await call('/event','POST',{type:document.querySelector('#event').value,createdAt:new Date().toISOString()})}async function status(){try{await call('/status')}catch(e){document.querySelector('#result').textContent='Service is not running.'}}</script></body></html>
