<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuadChat Service Lab</title><style>body{font:16px system-ui;background:#0b1513;color:#eaf7f1;max-width:700px;margin:55px auto;padding:0 20px}section{background:#12221d;border:1px solid #29453a;border-radius:12px;padding:20px;margin:15px 0}button{font:inherit;padding:11px 15px;border:0;border-radius:8px;background:#287b65;color:#fff;font-weight:700;cursor:pointer}pre{background:#07100d;padding:14px;border-radius:8px}.wait{color:#ffd36c}.ok{color:#79e2a5}</style><h1>QuadChat Service Lab</h1><p id="state" class="wait">Checking local service…</p><section><h2>Authorize local service</h2><p>Authorize this running local service with one click. No token copying is required.</p><button onclick="authorize()">Authorize service</button></section><section><h2>Send test event</h2><button onclick="send()">Send event</button></section><pre id="result"></pre><script>const base='http://127.0.0.1:43721';let token=sessionStorage.getItem('quadchat-service-test-token')||new URLSearchParams(location.search).get('service_token')||'';if(token){sessionStorage.setItem('quadchat-service-test-token',token);history.replaceState({},'',location.pathname)}async function status(){try{const r=await fetch(base+'/status'),d=await r.json(),e=document.querySelector('#state');e.textContent=d.paired?'✓ Local service authorized':'Waiting for authorization';e.className=d.paired?'ok':'wait'}catch{state.textContent='Service is not running'}}async function authorize(){try{const r=await fetch(base+'/authorize-url'),d=await r.json();location.href=d.url}catch(e){result.textContent=e.message}}async function send(){try{const r=await fetch(base+'/event',{method:'POST',headers:{'X-QuadChat-Test-Token':token}});result.textContent=`${r.status} ${await r.text()}`}catch(e){result.textContent=e.message}}status();setInterval(status,1500)</script></html>
