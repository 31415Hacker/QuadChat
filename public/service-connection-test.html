<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuadChat Service Lab</title><style>body{font:15px system-ui;background:#0b1513;color:#eaf7f1;max-width:760px;margin:40px auto;padding:0 20px}section{background:#12221d;border:1px solid #29453a;border-radius:12px;padding:18px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #3a5a4c;box-sizing:border-box}input,select{width:100%;background:#09110f;color:#edf8f2}button{background:#287b65;color:white;cursor:pointer}label{display:grid;gap:6px;margin:12px 0}pre{background:#07100d;border-radius:8px;padding:12px;white-space:pre-wrap;color:#b9e8ce}</style></head><body><h1>QuadChat Service Lab</h1><section><h2>Authorize local service</h2><p>Paste the state token printed by the service, then authorize in the browser.</p><label>State token<input id="token" type="password"></label><button onclick="location.href='/service-authorize.html?state='+encodeURIComponent(token.value)">Open authorization page</button></section><section><h2>Send test event</h2><button onclick="send()">Send event</button></section><pre id="result">Start the service and authorize it first.</pre><script>async function send(){try{let r=await fetch('http://127.0.0.1:43721/event',{method:'POST',headers:{'X-QuadChat-Test-Token':token.value}});result.textContent=`${r.status} ${await r.text()}`}catch(e){result.textContent=e.message}}</script></body></html>
