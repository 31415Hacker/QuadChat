<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authorize QuadChat Service</title>
    <style>body{font:16px system-ui;background:#0b1513;color:#edf8f2;max-width:560px;margin:80px auto;padding:24px}main{background:#12221d;border:1px solid #29453a;border-radius:14px;padding:28px}button{padding:11px 16px;border:0;border-radius:8px;background:#287b65;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.ok{color:#79e2a5}.bad{color:#ff9f9f}</style>
  </head>
  <body>
    <main>
      <h1>Authorize QuadChat Service</h1>
      <p id="identity">Checking your QuadChat session…</p>
      <p>The service will receive notification events for this account only. It cannot read chat history, send messages, or change your account.</p>
      <button id="approve" disabled>Authorize service</button>
      <p id="error" class="bad" role="alert"></p>
    </main>
    <script type="module" src="/src/companion-authorize.js"></script>
  </body>
</html>
