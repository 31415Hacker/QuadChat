[package]
name = "quadchat-background-service"
version = "1.5.3"
edition = "2021"
description = "QuadChat background companion service"

[dependencies]
getrandom = "0.2"
keyring = "4.2"
notify-rust = "4"
base64 = "0.22"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
global-hotkey = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webbrowser = "1"

[[bin]]
name = "quadchat-background-service"
path = "src/main.rs"
